name: KrishiMitra CD

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: CD trigger guard
    runs-on: ubuntu-latest
    steps:
      - name: Explain scope
        run: |
          echo "CD deploys only main/master pushes or manual workflow_dispatch runs."
          echo "Event:  ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"

  wait-for-ci:
    name: Wait for CI to pass
    runs-on: ubuntu-latest
    needs: guard
    if: github.event_name == 'push'
    permissions:
      actions: read
    steps:
      - name: Block until KrishiMitra CI succeeds for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const deadline = Date.now() + 30 * 60 * 1000;
            while (Date.now() < deadline) {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
                per_page: 50,
              });
              const ci = runs.data.workflow_runs.find(r => r.name === 'KrishiMitra CI');
              if (ci && ci.status === 'completed') {
                if (ci.conclusion === 'success') {
                  core.info('KrishiMitra CI passed for ' + sha);
                  return;
                }
                core.setFailed('KrishiMitra CI concluded "' + ci.conclusion + '" for ' + sha + ' - refusing to deploy. Fix CI or use workflow_dispatch to override deliberately.');
                return;
              }
              core.info(ci ? ('CI status: ' + ci.status + ' - waiting...') : 'CI run not found yet - waiting...');
              await new Promise(r => setTimeout(r, 30000));
            }
            core.setFailed('Timed out after 30 min waiting for KrishiMitra CI on ' + sha + '.');

  pre-deploy-check:
    name: Pre-deploy check
    runs-on: ubuntu-latest
    needs:
      - guard
      - wait-for-ci
    if: >
      !cancelled() && needs.guard.result == 'success' &&
      (needs.wait-for-ci.result == 'success' || needs.wait-for-ci.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Django check and migrations
        working-directory: backend
        env:
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          DEBUG: "True"
          DATABASE_URL: sqlite:////tmp/pre-deploy.db
          ALLOWED_HOSTS: localhost,testserver
          RATE_LIMIT_ENABLED: "false"
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run
          echo "Pre-deploy Django checks passed"

  publish-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: pre-deploy-check
    outputs:
      mode: ${{ steps.docker_meta.outputs.push_image == 'true' && 'pushed to Docker Hub' || 'built only (no registry credentials)' }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Resolve Docker publishing mode
        id: docker_meta
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "push_image=true" >> "$GITHUB_OUTPUT"
            echo "image_name=${DOCKERHUB_USERNAME}/krishimitra-ai" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials found; image will be pushed."
          else
            echo "push_image=false" >> "$GITHUB_OUTPUT"
            echo "image_name=krishimitra-ai" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials missing; image will be build-tested only."
          fi

      - name: Login to Docker Hub
        if: steps.docker_meta.outputs.push_image == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.docker_meta.outputs.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: ${{ steps.docker_meta.outputs.push_image == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs:
      - pre-deploy-check
      - publish-docker
    outputs:
      deploy: ${{ steps.trigger.outputs.deploy }}
      health: ${{ steps.health.outputs.health }}
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
    steps:
      - name: Trigger Render deploy if configured
        id: trigger
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "deploy=NOT DEPLOYED (RENDER_DEPLOY_HOOK_URL secret is not set)" >> "$GITHUB_OUTPUT"
            echo "RENDER_DEPLOY_HOOK_URL is not set; skipping Render deploy."
            exit 0
          fi
          status=$(curl -sS -o /tmp/render_response.json -w "%{http_code}" \
            -X POST "$RENDER_DEPLOY_HOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"commitHash\":\"${{ github.sha }}\"}")
          cat /tmp/render_response.json || true
          if [ "$status" -ge 400 ]; then
            echo "Render deploy hook failed with HTTP $status"
            exit 1
          fi
          echo "deploy=deploy hook accepted (HTTP $status)" >> "$GITHUB_OUTPUT"
          echo "Render deploy hook accepted with HTTP $status"

      - name: Verify Render health if configured
        id: health
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "health=not checked (no deploy was triggered)" >> "$GITHUB_OUTPUT"
            echo "Render deploy was skipped; skipping post-deploy health check."
            exit 0
          fi
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "health=NOT VERIFIED (RENDER_SERVICE_URL secret is not set)" >> "$GITHUB_OUTPUT"
            echo "RENDER_SERVICE_URL is not set; skipping live health check."
            exit 0
          fi
          url="${RENDER_SERVICE_URL%/}/api/health/"
          for attempt in $(seq 1 20); do
            status=$(curl -sS -o /dev/null -w "%{http_code}" "$url" --max-time 10 || echo "000")
            if [ "$status" = "200" ]; then
              echo "health=HTTP health passed; revision NOT VERIFIED at $url" >> "$GITHUB_OUTPUT"
              echo "Render service healthy at $url"
              exit 0
            fi
            echo "Attempt $attempt: health returned $status"
            sleep 15
          done
          echo "Render health check timed out for $url"
          exit 1

  deploy-summary:
    name: Deploy summary
    runs-on: ubuntu-latest
    needs:
      - guard
      - pre-deploy-check
      - publish-docker
      - deploy-render
    if: always()
    steps:
      - name: Print results
        env:
          RENDER_DEPLOY: ${{ needs.deploy-render.outputs.deploy }}
          RENDER_HEALTH: ${{ needs.deploy-render.outputs.health }}
          DOCKER_MODE: ${{ needs.publish-docker.outputs.mode }}
        run: |
          echo "Branch:      ${{ github.ref_name }}"
          echo "Commit:      ${{ github.sha }}"
          echo "Guard:       ${{ needs.guard.result }}"
          echo "Pre-deploy:  ${{ needs.pre-deploy-check.result }}"
          echo "Docker job:  ${{ needs.publish-docker.result }} - ${DOCKER_MODE:-unknown}"
          echo "Render job:  ${{ needs.deploy-render.result }}"
          echo "  deploy:    ${RENDER_DEPLOY:-did not run}"
          echo "  health:    ${RENDER_HEALTH:-did not run}"
          if [ "${{ needs.pre-deploy-check.result }}" = "failure" ] || \
             [ "${{ needs.publish-docker.result }}" = "failure" ] || \
             [ "${{ needs.deploy-render.result }}" = "failure" ]; then
            echo "Deployment failed."
            exit 1
          fi
          case "$RENDER_DEPLOY" in
            "NOT DEPLOYED"*)
              echo
              echo "WARNING: this workflow shipped nothing to Render via a deploy hook."
              echo "Render GitHub App auto-deploy may run independently; its outcome is unknown here."
              echo "Check Render Events for commit ${{ github.sha }} and verify the running revision."
              echo "RENDER_DEPLOY_HOOK_URL is optional when platform auto-deploy is configured."
              ;;
          esac
          echo "Deployment workflow completed."
