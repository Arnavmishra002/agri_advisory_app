databases:
  - name: agri-advisory-db
    databaseName: agri_advisory
    user: agri_user
    plan: free

services:
  - type: keyvalue
    name: agri-advisory-cache
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: agri-advisory-web
    env: python
    plan: free
    # No rootDir — run from repo root so both frontend/ and backend/ are accessible
    buildCommand: >-
      cd frontend && npm ci --no-audit --no-fund --silent && npm run build && cd .. &&
      pip install -r backend/requirements.txt &&
      cd backend && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: "cd backend && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --worker-class gthread --log-level info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agri-advisory-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: STRICT_PRODUCTION_CONFIG
        value: "true"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: NODE_VERSION
        value: "20.18.0"
      # PERF: Free tier has 512MB RAM — single worker prevents OOM
      # preload_app=True in gunicorn.conf.py shares TF model across threads
      - key: WEB_CONCURRENCY
        value: "1"
      # FIX: ensure Django importable in all execution contexts
      - key: PYTHONPATH
        value: "/opt/render/project/src/backend"
      # Serve the built Vite SPA at the root via Django + WhiteNoise
      - key: SERVE_FRONTEND
        value: "true"
      - key: FRONTEND_AT_ROOT
        value: "true"
      # API keys — fill these in the Render dashboard after first deploy
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      # Anthropic Claude — primary chatbot brain (set in Render dashboard)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: "claude-3-5-sonnet-latest"
      # Open LLM over the net (Groq etc.) — production "local LLM" tier
      - key: OPEN_LLM_BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: OPEN_LLM_API_KEY
        sync: false
      - key: OPEN_LLM_MODEL
        value: "llama-3.3-70b-versatile"
      - key: WHATSAPP_TOKEN
        value: ""
      - key: WHATSAPP_PHONE_ID
        value: ""
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        value: ""
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: GROQ_API_KEY
        value: ""
      - key: MQTT_BROKER_HOST
        value: ""
      - key: MQTT_BROKER_PORT
        value: "1883"
      - key: MQTT_USERNAME
        value: ""
      - key: MQTT_PASSWORD
        value: ""
      - key: MQTT_TOPIC_PREFIX
        value: "krishimitra/farm"
      - key: MQTT_CLIENT_ID
        value: "krishimitra-backend-web"
      - key: FETCH_POOL_WORKERS
        value: "8"
      - key: PHASE1_TIMEOUT_S
        value: "8"
      - key: PHASE1_BASE_URL
        sync: false
      - key: PHASE1_SERVICE_TOKEN
        sync: false
      - key: CHAT_LOCAL_AI_MAX_CONCURRENCY
        value: "2"
      - key: RAG_INDEX_REQUIRED
        value: "true"
      - key: DISEASE_CLASSIFICATION_ENABLED
        value: "false"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agri-advisory-cache
          property: connectionString
      - key: OLLAMA_MODEL
        value: "krishimitra-llm"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_FAIL_OPEN
        value: "false"
      - key: LAUNCH_CHECK
        value: "false"

  - type: worker
    name: agri-advisory-mqtt-worker
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py run_mqtt_subscriber"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agri-advisory-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agri-advisory-cache
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MQTT_BROKER_HOST
        value: ""
      - key: MQTT_BROKER_PORT
        value: "1883"
      - key: MQTT_USERNAME
        value: ""
      - key: MQTT_PASSWORD
        value: ""
      - key: MQTT_TOPIC_PREFIX
        value: "krishimitra/farm"
      - key: MQTT_CLIENT_ID
        value: "krishimitra-backend-worker"
