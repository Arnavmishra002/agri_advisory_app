# Production-only overrides.
#
# Run with both files so Docker does not auto-load docker-compose.override.yml:
#   docker compose --env-file .env.production \
#     -f docker-compose.yml -f docker-compose.production.yml \
#     --profile all up --build -d
#
# This file intentionally fails interpolation when a launch credential is
# absent. Developer-friendly fallbacks belong in docker-compose.override.yml,
# never in the farmer production stack.

services:
  web:
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      DEBUG: "False"
      STRICT_PRODUCTION_CONFIG: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-krishimitra}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-krishimitra}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_FAIL_OPEN: "false"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set explicit production hosts}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set explicit HTTPS frontend origins}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set explicit HTTPS trusted origins}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
      DATA_GOV_IN_API_KEY: ${DATA_GOV_IN_API_KEY:?Set the data.gov.in API key}
      SENTRY_DSN: ${SENTRY_DSN:?Set the production Sentry DSN}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:?Set the Twilio account SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:?Set the Twilio auth token}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:?Set the registered Twilio sender}
      PHASE1_BASE_URL: http://phase1:8001
      PHASE1_SERVICE_TOKEN: ${PHASE1_SERVICE_TOKEN:?Set a random Phase 1 bearer token}
      RAG_INDEX_REQUIRED: "true"
      DISEASE_CLASSIFICATION_ENABLED: "false"
      ML_ALLOW_UNVERIFIED_MODEL: "false"
      LAUNCH_CHECK: "true"
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
      phase1:
        condition: service_healthy
        required: true

  celery:
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      DEBUG: "False"
      DATABASE_URL: postgresql://${POSTGRES_USER:-krishimitra}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-krishimitra}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      SENTRY_DSN: ${SENTRY_DSN:?Set the production Sentry DSN}

  phase1:
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      DEBUG: "False"
      DATABASE_URL: postgresql://${POSTGRES_USER:-krishimitra}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-krishimitra}
      PHASE1_SERVICE_TOKEN: ${PHASE1_SERVICE_TOKEN:?Set a random Phase 1 bearer token}
      PHASE1_REQUIRE_SERVICE_TOKEN: "true"
      PHASE1_ALLOW_ALL_CORS: "false"
      PHASE1_CORS_ALLOWED_ORIGINS: ""
      RAG_INDEX_REQUIRED: "true"

  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-krishimitra}
      POSTGRES_USER: ${POSTGRES_USER:-krishimitra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}

